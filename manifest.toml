#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "oxicloud"
name = "OxiCloud"
description.en = "Secure & lightweight self-hosted cloud storage"
description.fr = "Service de stockage cloud auto-hébergé, sécurisé et léger"

version = "0.10.1~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "MIT"
website = "https://atalayalabs.github.io/OxiCloud/"
code = "https://github.com/AtalayaLabs/OxiCloud/"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "40M"
ram.build = "110M"
ram.runtime = "90M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/oxicloud"
    
    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"
    
    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["ar", "de", "en", "es", "fa", "fr", "hi", "it", "ja", "ko", "nl", "pl", "pt", "ru", "zh", "zh-TW"]
    default = "fr"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/AtalayaLabs/OxiCloud/releases/download/v0.10.1/oxicloud-0.10.1-x86_64-unknown-linux-musl.tar.gz"
    amd64.sha256 = "d1f53e1fb2afd00606fc3940fe82eee04886bfbf87d0d4bc820d955fc55a49cc"
    arm64.url = "https://github.com/AtalayaLabs/OxiCloud/releases/download/v0.10.1/oxicloud-0.10.1-aarch64-unknown-linux-musl.tar.gz"
    arm64.sha256 = "b460f75c590dc9bbe789b3b64ef8167607a24ec38250ea908a6f914d45ee85b0"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "oxicloud-\\d+\\.\\d+-x86_64-unknown-linux-musl\\.tar\\.gz"
    autoupdate.asset.arm64 = "oxicloud-\\d+\\.\\d+-aarch64-unknown-linux-musl\\.tar\\.gz"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    api.url = "/api"
    api.auth_header = false
    api.show_tile = false
    api.protected= true
    api.allowed = ["visitors", "all_users"]

    [resources.ports]

    [resources.apt]
    packages = "postgresql, ffmpeg"

    [resources.database]
    type = "postgresql"
